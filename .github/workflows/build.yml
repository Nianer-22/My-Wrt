name: ImmortalWrt 25.12.2 X86_64 Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immortalwrt-x86-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. 获取自己的配置仓库
      - name: Checkout Configuration
        uses: actions/checkout@v4
        with:
          path: config-repo

      # 2. 获取 ImmortalWrt 官方源码
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v25.12.2
          path: openwrt

      # 3. 安装编译依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            libxml-parser-perl \
            libxml2-utils \
            libxslt1-dev \
            libzstd-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            python3-yaml \
            rsync \
            unzip \
            file \
            wget \
            curl \
            jq \
            zstd \
            swig \
            fdisk \
            time \
            xsltproc \
            device-tree-compiler

      # 4. 更新软件源
      - name: Update Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 导入配置并执行自定义脚本
      - name: Load Configuration
        working-directory: openwrt
        run: |
          set -e

          test -f ../config-repo/config/seed.config
          test -f ../config-repo/scripts/diy-part1.sh

          cp ../config-repo/config/seed.config .config

          chmod +x ../config-repo/scripts/diy-part1.sh
          bash ../config-repo/scripts/diy-part1.sh

          make defconfig

          echo "Checking build configuration..."

          grep -Fx 'CONFIG_TARGET_x86=y' .config
          grep -Fx 'CONFIG_TARGET_x86_64=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_EXT4FS=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config
          grep -Fx 'CONFIG_GRUB_EFI_IMAGES=y' .config

          echo "Build configuration check passed."

      # 6. 下载编译所需源码包
      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j8

      # 7. 编译固件
      - name: Compile Firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      # 8. 检查固件并分析分区容量
      - name: Check Firmware
        run: |
          set -euo pipefail

          cd openwrt/bin/targets/x86/64

          echo "===== Firmware files ====="
          ls -lh

          IMAGE=$(find . -maxdepth 1 \
            -name '*ext4-combined-efi.img.gz' \
            -type f | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EFI EXT4 firmware not found!"
            exit 1
          fi

          echo "Firmware found: $IMAGE"

          # 检查 gzip 文件完整性
          gzip -t "$IMAGE"

          # 生成 SHA256
          sha256sum "$IMAGE" > sha256sums.txt

          # 解压固件镜像
          RAW_IMAGE="${IMAGE%.gz}"
          gzip -dc "$IMAGE" > "$RAW_IMAGE"

          # 导出原始分区表
          sfdisk --dump "$RAW_IMAGE" > partition-table.txt

          # 计算每个分区的实际容量
          {
            echo ""
            echo "===== Partition Size Report ====="

            sfdisk --json "$RAW_IMAGE" | jq -r '
              .partitiontable as $pt |
              "Device: \($pt.device)",
              "Partition table: \($pt.label)",
              "Sector size: \($pt.sectorsize) bytes",
              "",
              "Node\tStart sector\tSectors\tSize (MiB)\tType\tName",
              (
                $pt.partitions[] |
                [
                  .node,
                  (.start | tostring),
                  (.size | tostring),
                  ((.size * $pt.sectorsize / 1048576 * 100 | round) / 100 | tostring),
                  (.type // "-"),
                  (.name // "-")
                ] | @tsv
              )
            '
          } >> partition-table.txt

          echo "===== Partition Table ====="
          cat partition-table.txt

          # 删除临时解压镜像，保留压缩固件
          rm -f "$RAW_IMAGE"

          echo "Firmware check completed!"

      # 9. 上传 GitHub Actions 构建产物
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.2-X86_64
          path: |
            openwrt/bin/targets/x86/64/*ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/config.buildinfo
            openwrt/bin/targets/x86/64/sha256sums.txt
            openwrt/bin/targets/x86/64/partition-table.txt
          if-no-files-found: error
          retention-days: 14

      # 10. 自动发布到 GitHub Releases
      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-25.12.2-${{ github.run_number }}
          name: ImmortalWrt 25.12.2 X86_64 Build ${{ github.run_number }}
          body: |
            ImmortalWrt 25.12.2

            Architecture: x86_64

            Image: EXT4-COMBINED-EFI

            Boot: UEFI

            RootFS: 1024 MB

            LAN: 10.10.10.1

            Automatically built by GitHub Actions.
          files: |
            openwrt/bin/targets/x86/64/*ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/config.buildinfo
            openwrt/bin/targets/x86/64/sha256sums.txt
            openwrt/bin/targets/x86/64/partition-table.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
