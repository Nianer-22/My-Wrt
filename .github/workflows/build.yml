
name: ImmortalWrt 25.12.2 X86_64 Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immortalwrt-x86-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Configuration
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v25.12.2
          path: openwrt

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-dev python3-pip \
            python3-setuptools python3-pyelftools \
            python3-yaml python3-requests \
            rsync unzip zlib1g-dev file wget curl \
            jq zstd swig time device-tree-compiler \
            qemu-utils subversion

      - name: Update Feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Configuration
        working-directory: openwrt
        run: |
          set -e

          test -f ../config-repo/config/seed.config
          test -f ../config-repo/scripts/diy-part1.sh

          cp ../config-repo/config/seed.config .config

          bash ../config-repo/scripts/diy-part1.sh

          make defconfig

          echo "Checking configuration..."

          grep -Fx 'CONFIG_TARGET_x86_64=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_EXT4FS=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config
          grep -Fx 'CONFIG_GRUB_EFI_IMAGES=y' .config

          echo "Configuration check passed!"

      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile Firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || {
            echo "Parallel compilation failed."
            echo "Retrying with single thread..."
            make -j1 V=s
          }

      - name: Check Firmware
        run: |
          set -euo pipefail

          cd openwrt/bin/targets/x86/64

          IMAGE=$(find . -maxdepth 1 \
            -type f \
            -name '*ext4-combined-efi.img.gz' \
            | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EFI EXT4 image not found!"
            ls -lh
            exit 1
          fi

          echo "Firmware: $IMAGE"

          gzip -t "$IMAGE"

          sha256sum "$IMAGE" > sha256sums.txt

          gzip -dc "$IMAGE" > firmware.img

          sfdisk --dump firmware.img > partition-table.txt

          echo "Partition table:"
          cat partition-table.txt

          echo "Firmware verification completed."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.2-X86_64
          path: |
            openwrt/bin/targets/x86/64/*ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/config.buildinfo
            openwrt/bin/targets/x86/64/sha256sums.txt
            openwrt/bin/targets/x86/64/partition-table.txt
          if-no-files-found: error
          retention-days: 14

      - name: Release Firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: immortalwrt-25.12.2-${{ github.run_id }}-${{ github.run_attempt }}
          name: ImmortalWrt 25.12.2 X86_64 Build ${{ github.run_number }}
          body: |
            ImmortalWrt 25.12.2

            Architecture: x86_64
            Image: EXT4-COMBINED-EFI
            Boot: UEFI
            RootFS partition target: 1024 MB
            LAN: 10.10.10.1

            Automatically built by GitHub Actions.
          files: |
            openwrt/bin/targets/x86/64/*ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/config.buildinfo
            openwrt/bin/targets/x86/64/sha256sums.txt
            openwrt/bin/targets/x86/64/partition-table.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
