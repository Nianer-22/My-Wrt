name: Build ImmortalWrt x86_64 SquashFS EFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
           sudo apt-get update
           sudo apt-get install -y software-properties-common
           sudo add-apt-repository -y universe
           sudo apt-get update
           sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
           bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
           git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
           libmpc-dev libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool lrzsz msmtp nano ninja-build \
           p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools python3-dev qemu-utils rsync \
           scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
           sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
           sudo apt-get autoremove --purge -y
           sudo apt-get clean

      - name: Clone latest ImmortalWrt source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com openwrt

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom settings
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          ../diy-part2.sh

      - name: Generate .config
        working-directory: ./openwrt
        run: |
          cat << 'EOF' > .config
          # 1. 目标架构：x86_64
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # 2. 镜像格式：仅生成 SquashFS + EFI 启动格式，屏蔽多余镜像
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_GRUB_EFI_IMAGES=y
          # CONFIG_GRUB_IMAGES is not set
          # CONFIG_TARGET_ROOTFS_EXT4FS is not set
          # CONFIG_ISO_IMAGES is not set
          # CONFIG_VDI_IMAGES is not set
          # CONFIG_VMDK_IMAGES is not set
          # CONFIG_QCOW2_IMAGES is not set

          # 3. 软件空间（Overlay/RootFS 分区大小）设为 1024MB (1GB)
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          # 4. 基础中文界面与常用系统工具
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF
          make defconfig

      - name: Download packages
        working-directory: ./openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload SquashFS EFI firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86_64-squashfs-combined-efi
          path: openwrt/bin/targets/x86/64/*squashfs-combined-efi.img.gz
