
name: Build OpenWrt 25.12 x86_64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt version"
        required: true
        default: "25.12.6"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Install dependencies
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            rsync \
            wget \
            unzip \
            python3 \
            file \
            zstd \
            gzip \
            xz-utils \
            tar \
            jq

      # 2. Download ImageBuilder
      - name: Download ImageBuilder
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid OpenWrt version"
            exit 1
          fi

          BUILDER="openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"

          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${BUILDER}"

          wget -O "$BUILDER" "$URL"

          mkdir -p imagebuilder

          tar --zstd -xf "$BUILDER" -C imagebuilder

          echo "ImageBuilder downloaded successfully"

      # 3. Prepare first boot configuration
      - name: Prepare first boot configuration
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-set-lan <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='192.168.100.1'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-set-lan

      # 4. Build OpenWrt firmware
      - name: Build OpenWrt firmware
        run: |
          set -euo pipefail

          IB_DIR=$(find imagebuilder \
            -maxdepth 1 \
            -type d \
            -name 'openwrt-imagebuilder-*' \
            -print -quit)

          if [ -z "$IB_DIR" ]; then
            echo "ERROR: ImageBuilder directory not found"
            exit 1
          fi

          cd "$IB_DIR"

          make image \
            PROFILE="generic" \
            ROOTFS_PARTSIZE="1024" \
            PACKAGES="luci luci-i18n-base-zh-cn luci-app-attendedsysupgrade" \
            FILES="$GITHUB_WORKSPACE/files"

      # 5. Collect firmware
      - name: Collect firmware
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          IMAGE=$(find imagebuilder \
            -type f \
            -name '*ext4-combined-efi.img.gz' \
            -print -quit)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EXT4 EFI firmware image not found"
            exit 1
          fi

          cp "$IMAGE" "$GITHUB_WORKSPACE/output/"

          cd "$GITHUB_WORKSPACE/output"

          sha256sum *.img.gz > sha256sums.txt

          echo "Firmware generated successfully"

          ls -lh

      # 6. Upload firmware artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt-25.12-x86_64-UEFI-EXT4-1GB
          path: output/*
          if-no-files-found: error
          retention-days: 14

      # 7. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: OpenWrt-${{ inputs.version }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          name: OpenWrt ${{ inputs.version }} x86_64 UEFI EXT4 1GB
          body: |
            OpenWrt 25.12 x86_64 Custom Firmware

            - Architecture: x86_64
            - Boot: UEFI
            - Image: COMBINED-EFI
            - Filesystem: EXT4
            - Root filesystem target: 1024 MB
            - LAN IP: 192.168.100.1/24
            - LuCI: Chinese language package
            - Attended Sysupgrade: Included

          files: |
            output/*.img.gz
            output/sha256sums.txt

          draft: false
          prerelease: false
          generate_release_notes: true
